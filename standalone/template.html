<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- GitHub Pages caches for ~10 minutes; without these a tester can open the link
     and see yesterday's build with no way of knowing. -->
<meta http-equiv="cache-control" content="no-cache, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<title>Urban Sports Club — Urby signup pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>/*__CSS__*/
/* ============================================================
   standalone-only additions
   ============================================================ */
#app { min-height: 100vh; }
.linkish { background:none; border:0; padding:0; color:inherit; text-decoration:underline; cursor:pointer; font:inherit; }
/* the wordmark and nav links are <button> here rather than <a> */
.topbar__left { align-items: flex-start; }
button.wordmark, button.link-plain { text-align: left; }
h1:focus, h2:focus { outline: none; }
.copybox { word-break:break-all; background:var(--page-grey); padding:12px 14px; border-radius:6px; font-size:12.5px; line-height:1.5; }

/* Question progress: the number only. Its bar moved into step 1 of the stepper, where
   the questions actually live — see the note above topbar(). A second full-width track
   here made a child of step 1 look like a sibling of the whole journey. */
.qprogress { margin-bottom:6px; }
.qprogress__label { font-size:13px; font-weight:700; color:var(--navy-soft); white-space:nowrap; }

/* Urby typing indicator */
.typing { display:inline-flex; gap:5px; align-items:center; background:var(--grey-bubble); border-radius:7px; padding:16px 20px; margin-bottom:26px; }
.typing span { width:7px; height:7px; border-radius:50%; background:#9a9a9a; animation:blink 1.1s infinite both; }
.typing span:nth-child(2){ animation-delay:.18s } .typing span:nth-child(3){ animation-delay:.36s }
@keyframes blink { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-2px)} }

/* Urby's line on the form steps, so she does not vanish when it gets personal */
.ula-note { display:flex; gap:13px; align-items:flex-start; background:var(--cream); border:1px solid var(--cream-line);
  border-radius:var(--radius); padding:16px 18px; margin:0 0 24px; }
.ula-note p { margin:0; font-size:16px; line-height:1.45; color:var(--navy); }

/* collapsed disclosures — native details/summary, so keyboard and screen readers work free */
.disclosure { border-top:1px solid var(--border); }
.disclosure:last-of-type { border-bottom:1px solid var(--border); }
.disclosure > summary { display:flex; align-items:center; justify-content:flex-start; gap:13px; cursor:pointer;
  padding:17px 2px; font-size:16.5px; font-weight:700; list-style:none; }
.disclosure > summary::-webkit-details-marker { display:none; }
.disclosure > summary::after { content:""; width:9px; height:9px; border-right:2px solid var(--navy-soft);
  border-bottom:2px solid var(--navy-soft); transform:rotate(45deg); transition:transform .15s ease; flex:0 0 auto; margin-right:4px; }
.disclosure[open] > summary::after { transform:rotate(225deg); }
.disclosure > summary:focus-visible { outline:3px solid #1b4bd8; outline-offset:2px; }
.disclosure__body { padding:2px 2px 22px; }
.disclosure__hint { font-weight:400; color:var(--navy-soft); font-size:14.5px; margin-left:auto; }
/* an icon per row, so the contents read as things rather than links */
.disclosure__icon { flex:0 0 auto; display:grid; place-items:center; width:34px; height:34px;
  border-radius:50%; background:var(--yellow-pale); }

/* the decision block */
.decision { background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:clamp(22px,2.6vw,32px); }
.decision__price { font-size:clamp(34px,4vw,46px); font-weight:800; letter-spacing:-.035em; line-height:1; margin:14px 0 6px; }
.decision__price span { font-size:19px; font-weight:600; letter-spacing:0; color:var(--navy-soft); }
.decision__why { font-size:17.5px; line-height:1.5; color:var(--navy); margin:14px 0 0; max-width:46ch; }

/* alternatives, deliberately quieter than the recommendation */
.alt-quiet { display:flex; flex-direction:column; gap:10px; }
.alt-quiet button { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px dashed var(--border); padding:13px 2px; font-size:16px; }
.alt-quiet button:hover { background:var(--page-grey); }
.alt-quiet b { font-weight:700; } .alt-quiet em { font-style:normal; color:var(--navy-soft); font-size:14.5px; }

/* venue strip + tappable cards */
.venue-strip { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
button.venue-card { padding:0; border:1px solid var(--cream-line); background:#fff; text-align:left; cursor:pointer; }
button.venue-card:hover { border-color:var(--ink); }
.venue-card__more { font-size:12px; font-weight:700; text-decoration:underline; margin-top:5px; display:block; }

/* venue sheet: a dialog on desktop, a bottom sheet on mobile */
.sheet { position:fixed; inset:0; background:rgba(24,24,24,.42); display:grid; place-items:center; padding:24px; z-index:60; }
.sheet[hidden] { display:none; }
.sheet__panel { background:#fff; border-radius:14px; max-width:520px; width:100%; max-height:88vh; overflow:auto;
  position:relative; box-shadow:0 24px 70px rgba(0,0,0,.22); }
.sheet__close { position:absolute; top:12px; right:14px; z-index:2; background:rgba(255,255,255,.92); border:0;
  width:34px; height:34px; border-radius:50%; font-size:20px; line-height:1; cursor:pointer; }
.sheet__media { position:relative; height:190px; background:var(--yellow-pale); display:grid; place-items:center; border-radius:14px 14px 0 0; overflow:hidden; }
.sheet__media img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.sheet__body { padding:22px 24px 26px; }
.sheet__row { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border); font-size:16px; }
.sheet__row:last-of-type { border-bottom:0; }
.chips { display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 4px; }
.chip-sm { font-size:13px; font-weight:600; background:var(--cream); border:1px solid var(--cream-line); border-radius:999px; padding:5px 11px; }
.covered { display:flex; gap:11px; align-items:flex-start; border-radius:var(--radius); padding:14px 16px; font-size:15.5px; line-height:1.45; margin-top:18px; }
.covered--yes { background:#e9f6ee; } .covered--no { background:var(--page-grey); }

@media (max-width: 620px) {
  .sheet { padding:0; place-items:end center; }
  .sheet__panel { max-width:none; border-radius:16px 16px 0 0; max-height:92vh; }
  .sheet__media { border-radius:16px 16px 0 0; height:160px; }
  .venue-strip { grid-template-columns:1fr 1fr; }
}

/* Ask Urby */
.ask { background:var(--cream); border:1px solid var(--cream-line); border-radius:var(--radius-lg); padding:24px 26px; margin-top:28px; }
.ask--compact { padding:18px 20px; margin-top:26px; }
.ask__head { display:flex; gap:12px; align-items:flex-start; margin-bottom:16px; }
.ask__title { font-weight:800; font-size:18px; letter-spacing:-.015em; }
.ask__sub { font-size:14.5px; color:var(--navy-soft); line-height:1.4; margin-top:2px; max-width:52ch; }
.ask__row { display:flex; gap:10px; }
.ask__row input { flex:1 1 auto; height:56px; padding:0 16px; border:1px solid var(--border); border-radius:var(--radius); background:#fff; outline:none; min-width:0; }
.ask__row input:focus { border-color:var(--ink); }
.ask__row .btn { height:56px; padding:0 26px; flex:0 0 auto; }
.ask__answer { background:#fff; border:1px solid var(--cream-line); border-radius:var(--radius); padding:18px 20px; margin-top:16px; }
.ask__answer p { margin:0; font-size:16.5px; line-height:1.55; }
.ask__source { font-size:13.5px; color:var(--navy-soft); margin:12px 0 0; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.ask__source a { text-decoration:underline; }
.ask__examples { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.ask__examples .chip-sm { cursor:pointer; background:#fff; }
.ask__examples .chip-sm:hover { border-color:var(--ink); }
.ask--fold > summary { cursor:pointer; list-style:none; padding-right:24px; position:relative; }
.ask--fold > summary::-webkit-details-marker { display:none; }
.ask--fold > summary::after { content:""; position:absolute; right:2px; top:9px; width:8px; height:8px;
  border-right:2px solid var(--navy); border-bottom:2px solid var(--navy);
  transform:rotate(45deg); transition:transform .15s ease; }
.ask--fold[open] > summary::after { transform:rotate(225deg); }
.ask--fold:not([open]) > summary { margin-bottom:0; }

/* scroll cue on the landing page */
.scrollcue { display:flex; align-items:center; gap:10px; margin-top:34px; background:none; border:0; padding:0;
  font-size:16px; font-weight:700; color:var(--navy); cursor:pointer; }
.scrollcue span.arrow { width:34px; height:34px; border-radius:50%; border:1.5px solid var(--ink); display:grid; place-items:center; animation:nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }
@media (prefers-reduced-motion: reduce) { .scrollcue span.arrow { animation:none } }
@media (max-width: 620px) { .ask { padding:20px 18px; } .ask__row { flex-direction:column; } .ask__row .btn { width:100%; } }
@media (max-width: 1180px) {
  .plans-layout { grid-template-columns:1fr; }
  .plans-guide { position:static; max-width:620px; }
}
@media (max-width: 900px) {
  .plangrid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width: 620px) {
  .plans-page { padding-left:16px; padding-right:16px; }
  .plangrid { grid-template-columns:1fr; }
  .plancard__best { min-height:0; }
  .plans-guide { padding:20px 17px; }
  .plans-shared__ask { flex:1 1 100%; margin:5px 0 0; width:100%; }
  .plans-selection { align-items:stretch; flex-direction:column; }
  .plans-selection .btn { width:100%; }
}
</style>
</head>

<a class="skip-link" href="#main">Skip to main content</a>
<!-- The black bar was the loudest thing on every screen and it said the same sentence
     every time. It still has to be there — nobody should mistake a simulated payment for
     a real one — so it collapses to a marker instead of disappearing, and the build stamp
     stays legible in both states because that is how you tell whose build you are on. -->
<div class="demo-banner" id="demo-banner">
  <span class="demo-banner__short">Pilot demo</span>
  <span class="demo-banner__text">Pilot demo — real Urban Sports Club prices, terms and venues. Simulated payment.</span>
  <button class="linkish" data-go="data" style="color:var(--yellow-bright)">Journey data</button>
  <span class="demo-banner__build">build /*__BUILD__*/</span>
  <button type="button" class="demo-banner__toggle" data-banner-toggle aria-expanded="true" aria-controls="demo-banner">Hide</button>
</div>
<div id="app"></div>

<script>
/* =====================================================================
   Urban Sports Club — Urby signup pilot (self-contained build)

   Design intent, after a usability pass:
     - one decision per screen; everything else on demand, never on display
     - Urby holds the recommendation and stays present through details and payment
     - you can talk to Urby before giving an email; the ask to save comes once
       there is something worth saving
     - venues open in place, so exploring never costs you your progress

   The membership rules are a direct port of src/recommend.js. Add
   ?variant=email-first to see the email-first landing page for comparison.
   ===================================================================== */

const DATA = /*__DATA__*/;
const IMG  = /*__IMAGES__*/;
const VARIANT = new URLSearchParams(location.search).get('variant') === 'email-first' ? 'email-first' : 'guide-first';

/* ---------------- icons ---------------- */
const svg = (b, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
const ICONS = {
  pencil:'<path d="M4 20h4L20 8l-4-4L4 16v4Z"/><path d="M14.5 5.5 18.5 9.5"/>',

  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/>',

  bolt:'<path d="M13.4 3 6 13.4h4.6L9.9 21l7.6-10.6h-4.7Z"/>',

  sparkle:'<path d="M12 3v6M12 15v6M3 12h6M15 12h6M6.2 6.2l3.2 3.2M14.6 14.6l3.2 3.2M17.8 6.2l-3.2 3.2M9.4 14.6l-3.2 3.2"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>',
  home:'<path d="M4 11 12 4l8 7"/><path d="M6.5 9.6V20h11V9.6"/>',
  calendar:'<rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',

  speech:'<path d="M20 12.4c0 3.9-3.6 7-8 7-1 0-2-.2-2.9-.5L4.5 20.5l1.2-3.6A6.6 6.6 0 0 1 4 12.4c0-3.9 3.6-7 8-7s8 3.1 8 7Z"/>',
  arrowRight:'<path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>', chevron:'<path d="M9 5l7 7-7 7"/>', chevronDown:'<path d="M5 9l7 7 7-7"/>', back:'<path d="M15 19l-7-7 7-7"/>',

  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 8.2v.1"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5V10h-5.5"/>',
  question:'<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.6v.4M12 16.9v.1"/>',
  dumbbell:'<path d="M3.5 9.5v5M6.5 7.5v9M17.5 7.5v9M20.5 9.5v5M6.5 12h11"/>',
  glove:'<path d="M6 10.5V7.8a1.9 1.9 0 0 1 3.8 0v2.7M9.8 10.5V6.5a1.9 1.9 0 0 1 3.8 0v4M13.6 10.8V8.2a1.9 1.9 0 0 1 3.8 0v5.6c0 3.4-2.4 6.2-5.7 6.2s-5.7-2.8-5.7-6.2v-1.5"/>',
  waves:'<path d="M3 8.5c2 0 2.5 1.6 4.5 1.6S10 8.5 12 8.5s2.5 1.6 4.5 1.6S19 8.5 21 8.5"/><path d="M3 13.5c2 0 2.5 1.6 4.5 1.6S10 13.5 12 13.5s2.5 1.6 4.5 1.6S19 13.5 21 13.5"/><path d="M3 18.5c2 0 2.5 1.4 4.5 1.4S10 18.5 12 18.5s2.5 1.4 4.5 1.4S19 18.5 21 18.5"/>',
  mountain:'<path d="M3 19h18L14.2 6.5 11 12l-2-3Z"/><circle cx="17.4" cy="6" r="1.4"/>',

  racket:'<ellipse cx="14.5" cy="8.8" rx="5.3" ry="6.2" transform="rotate(38 14.5 8.8)"/><path d="M10.2 13.4 4 19.6"/>',
  music:'<circle cx="7" cy="17.5" r="2.6"/><circle cx="17.5" cy="15" r="2.6"/><path d="M9.6 17.5V7l10.5-2.4V15"/>',
  spa:'<path d="M12 20c0-4.5 2.8-8.5 7-10-1 5-3.3 8.4-7 10Z"/><path d="M12 20c0-4.5-2.8-8.5-7-10 1 5 3.3 8.4 7 10Z"/>',
  one:'<path d="M10 8.5 12.5 7v10"/><path d="M10 17h5"/>', two:'<path d="M9.5 8.6A2.9 2.9 0 0 1 15 10c0 2.4-5.5 4.4-5.5 7H15"/>',
  three:'<path d="M9.6 8.2a2.8 2.8 0 1 1 2.6 4.3 2.9 2.9 0 1 1-2.7 4.2"/>', four:'<path d="M14 6.5 9.2 14.4h6.2"/><path d="M14 11v6.5"/>',
  level1:'<rect x="3" y="14.5" width="3.4" height="5" rx="1" fill="currentColor" stroke="none"/><rect x="8.4" y="10.5" width="3.4" height="9" rx="1"/><rect x="13.8" y="6.5" width="3.4" height="13" rx="1"/><rect x="19.2" y="2.5" width="3.4" height="17" rx="1"/>',
  level2:'<rect x="3" y="14.5" width="3.4" height="5" rx="1" fill="currentColor" stroke="none"/><rect x="8.4" y="10.5" width="3.4" height="9" rx="1" fill="currentColor" stroke="none"/><rect x="13.8" y="6.5" width="3.4" height="13" rx="1"/><rect x="19.2" y="2.5" width="3.4" height="17" rx="1"/>',
  level3:'<rect x="3" y="14.5" width="3.4" height="5" rx="1" fill="currentColor" stroke="none"/><rect x="8.4" y="10.5" width="3.4" height="9" rx="1" fill="currentColor" stroke="none"/><rect x="13.8" y="6.5" width="3.4" height="13" rx="1" fill="currentColor" stroke="none"/><rect x="19.2" y="2.5" width="3.4" height="17" rx="1"/>',
  level4:'<rect x="3" y="14.5" width="3.4" height="5" rx="1" fill="currentColor" stroke="none"/><rect x="8.4" y="10.5" width="3.4" height="9" rx="1" fill="currentColor" stroke="none"/><rect x="13.8" y="6.5" width="3.4" height="13" rx="1" fill="currentColor" stroke="none"/><rect x="19.2" y="2.5" width="3.4" height="17" rx="1" fill="currentColor" stroke="none"/>',

  shield:'<path d="M12 3.2 5 6v6c0 4.2 3 7.4 7 8.8 4-1.4 7-4.6 7-8.8V6Z"/>',

  device:'<rect x="6.5" y="3" width="11" height="18" rx="2.2"/><path d="M10.6 18.2h2.8"/>',
  /* Saving is not buying, so it does not wear a cart or a card. */
  bookmark:'<path d="M6.5 3.5h11v17l-5.5-4-5.5 4Z"/>',
  /* A filled tick, for the one line that states a fact already counted rather than
     an item in a list. It carries its own colour, so it survives on cream. */
  checkFill:'<circle cx="12" cy="12" r="9" fill="#1f9d55" stroke="none"/><path d="M7.8 12.3 10.7 15l5.5-5.7" stroke="#fff" stroke-width="2.1"/>',

};
const icon = (n, s = 22) => svg(ICONS[n] || ICONS.info, s);
const ulaAvatar = (size='md') => {
  const cls = size==='sm'?'ula-avatar ula-avatar--sm':size==='lg'?'ula-avatar ula-avatar--lg':'ula-avatar';
  const px = size==='sm'?17:size==='lg'?30:22;

function weekPlan(groupIds = [], venues = [], planId = 'classic', frequency = 'twice') {
  const chosenDays = (S.weekDays||[]).filter(d=>DAY_ORDER.includes(d));
  const count = chosenDays.length || SESSIONS[frequency] || 2;
  const days = chosenDays.length
    ? DAY_ORDER.filter(d=>chosenDays.includes(d))
    : (DAY_SPREAD[count] || DAY_SPREAD[2]);
  const groups = (groupIds.length ? groupIds.map(groupById).filter(Boolean) : ACTIVITY_GROUPS)
    .filter(g => venues.some(v => venueInGroup(v,g)));
  const wantedVisits = count*4, allowedVisits = monthlyAllowance(planById(planId));
  const overAllowance = allowedVisits > 0 && wantedVisits > allowedVisits;
  if (!groups.length) return { sessions:[], perMonth:Math.min(wantedVisits, allowedVisits||wantedVisits), wantedVisits, allowedVisits, overAllowance, note:null };
  const used = new Set();
  const sessions = days.map((day,i) => {
    const custom = (S.weekSwap||{})[day];
    const customVenue = custom && typeof custom === 'object' ? venues.find(v=>v.id===custom.venueId) : null;
    const customGroup = customVenue && custom.groupId ? groupById(custom.groupId) : null;
    const group = customGroup || groups[i % groups.length];
    const forGroup = venues.filter(v => venueInGroup(v,group)).sort((a,b)=>a.distanceKm-b.distanceKm);
    const preferred = forGroup.filter(v => includedIn(v,planId));
    const swapped = customVenue ? customVenue.id : custom;
    const pick = (swapped && forGroup.find(v=>v.id===swapped))
      || preferred.find(v=>!used.has(v.id)) || preferred[0] || forGroup.find(v=>!used.has(v.id)) || forGroup[0];
    if (!pick) return null;
    used.add(pick.id);
    const included = includedIn(pick, planId);
    return { day, groupId:group.id, activity:group.label, icon:group.icon, venue:pick,
             distanceKm:pick.distanceKm, included, access:accessLabel(pick,planId),
             alternatives: forGroup.length,
             needs: included ? null : firstPlanWithAccess(pick) };
  }).filter(Boolean);
  const planName = (planById(planId)||{}).name || 'this plan';
  return { sessions, perMonth:Math.min(wantedVisits, allowedVisits||wantedVisits), wantedVisits, allowedVisits, overAllowance,
           note: overAllowance
             ? `This week is about ${wantedVisits} visits a month, and ${planName} allows ${allowedVisits}. Pick fewer days, or move up a plan.`
             : sessions.some(x=>!x.included) ? 'One of these needs a higher plan — swap it, or open it below.' : null };
}
/* The most persuasive number on the page, so it has to be the honest one: divided
   by the visits you can actually take, never by the visits you hoped for. Dividing
   35 € by 8 gave 4.40 € a session on a plan that allows 4. */
const perSession = (price, frequency='twice', plan=null) => {
  const wanted = visitsWanted(frequency);
  const perMonth = plan ? Math.min(wanted, monthlyAllowance(plan)) : wanted;
  return perMonth ? Math.round((price/perMonth)*10)/10 : null;
};
const accessLabel = (v,planId) => (v.access && typeof v.access[planId]==='string')

/* ---------------- recommendation rules (ported from src/recommend.js) ---------------- */
const planById = id => PLANS.find(p=>p.id===id)||null;
const planByRank = r => PLANS.find(p=>p.rank===r)||null;
const commitmentById = id => COMMITMENTS.find(c=>c.id===id)||COMMITMENTS[0];
const priceFor = (plan,cid) => plan[commitmentById(cid).priceField];
const FREQ_BASE = { once:1, twice:2, often:3, daily:4 };
const FREQ_WORDS = { once:'about once a week', twice:'twice a week', often:'three or four times a week', daily:'five or more times a week' };
const lowerFirst = s => s ? s.charAt(0).toLowerCase()+s.slice(1) : s;

function recommend(answers = {}, match = { venues:[], categories:[] }) {
  const reasons=[], appliedRules=[], notes=[];
  let rank = FREQ_BASE[answers.frequency] ?? 2;
  if (answers.frequency) { appliedRules.push('frequency-base'); reasons.push(`You said you'd realistically go ${FREQ_WORDS[answers.frequency]||'a couple of times a week'}.`); }
  else notes.push('You weren’t sure how often yet, so we assumed a couple of sessions a week. Change it any time.');
  /* Two rules used to bump the tier on a keyword — "you said unwind, so Classic".
     A tester was pushed to 75 € for one session a week that way, and the page then
     priced it at ~20 € a visit. Every bump above frequency now needs evidence: a
     named venue that the cheaper plan does not include. */
  const groups = (answers.activities||[]).filter(Boolean);
  const pool = match.pool || match.venues || [];

  /* The only rule that can move someone up on grounds other than frequency, and it
     needs proof: something they said they'd do, zero included venues near them on
     this plan, and at least one on a higher plan. It names both. */
  if (groups.length && pool.length) {
    const rankBefore = rank;
    const gaps = coverage(groups, pool, (planByRank(rank)||planByRank(2)).id).rows.filter(r=>r.none && r.unlockedBy.length);
    if (gaps.length) {
      const needed = gaps.map(r=>r.unlockedBy[0]).sort((a,b)=>a.rank-b.rank)[0];
      const gap = gaps.find(r=>r.unlockedBy.some(p=>p.id===needed.id));
      const target = Math.min(needed.rank, 3);   // never jump to the top plan on coverage alone
      if (target > rank) {
        rank = target; appliedRules.push('activity-not-covered');
        const from = planByRank(rankBefore)||planByRank(2);
        reasons.push(`Nowhere near you that does ${gap.short} is included on ${from.name} — the closest, ${gap.locked[0].name}, needs ${needed.name}.`);
      }
    }
  }

  const closeBy = (match.venues||[]).filter(v=>v.distanceKm<=2.5);
  if (closeBy.length>=3 && rank>2 && (answers.frequency==='twice'||answers.frequency==='once')) {
    /* only trim if the cheaper plan still covers everything they asked for — saving
       someone 40 € by quietly removing a venue they wanted is not a favour */
    const here = coverage(groups, pool, (planByRank(rank)||planByRank(2)).id);
    const trimmed = coverage(groups, pool, 'classic');
    if (here.totals.included === trimmed.totals.included) {
      rank = 2; appliedRules.push('nearby-sufficient');
      reasons.push(`${closeBy.length} of your places are within 2.5 km, and Classic already covers all of them.`);
    }
  }
  if (rank===4 && answers.frequency!=='daily'){ rank=3; appliedRules.push('cap-top-plan'); }

  /* Never sell a tier whose only advantage is something they did not ask for.
     Runs last, so it can undo any bump above it. */
  if (groups.length && pool.length) {
    const asIs = planByRank(rank)||planByRank(2);
    const cheaper = downsell(groups, pool, asIs.id, S.commitmentId, answers.frequency);
    const cheapPlan = cheaper ? planById(cheaper.planId) : null;
    /* ...but only down to a plan that can still carry the visits they told us about.
       Without that last clause this rule dropped a twice-a-week visitor to Essential
       because the venue happened to be included there — 8 visits a month against an
       allowance of 4. Coverage is not the only constraint. */
    if (cheapPlan && cheapPlan.rank < rank && carriesFrequency(cheapPlan, answers.frequency)) {
      rank = cheapPlan.rank; appliedRules.push('no-upsell-without-benefit');
      reasons.push(`${cheapPlan.name} opens the same places near you as ${asIs.name}, for ${cheaper.saves} € a month less — so I didn't put you on ${asIs.name}.`);
    }
  }

  /* The last word, and a hard one. The frequency they gave us is a floor on the
     monthly check-in allowance, not a hint: no rule above may leave them on a plan
     whose published allowance cannot carry it. An external reviewer found exactly
     that failure — "twice a week" recommended on 4 check-ins a month — and it is the
     one kind of error that discredits every other number on the page. */
  if (answers.frequency) {
    const need = visitsWanted(answers.frequency);
    const floor = PLANS.filter(p=>monthlyAllowance(p) >= need).sort((a,b)=>a.rank-b.rank)[0];
    if (floor && floor.rank > rank) {
      const was = planByRank(rank)||planByRank(2);
      rank = floor.rank; appliedRules.push('frequency-allowance-floor');
      /* the reason that argued for the plan we just left is now false */
      for (let i=reasons.length-1;i>=0;i--) if (reasons[i].includes("didn't put you on")) reasons.splice(i,1);
      reasons.push(`${was.name} allows only ${monthlyAllowance(was)} check-ins a month, and ${FREQ_WORDS[answers.frequency]} is about ${need}. ${floor.name} is the cheapest plan that carries that.`);
    } else if (!floor) {
      notes.push(`No plan covers ${need} check-ins a month — the most any plan allows is one a day.`);
    }
  }

  const plan = planByRank(rank)||planByRank(2);

  const areaName = whereName(match);
  const cats=(match.categories||[]).length;
  const top=[...new Set((match.venues||[]).flatMap(v=>v.affinityHits||[]))].slice(0,3).map(a=>ACTIVITY_LABELS[a]||a);
  const GOAL_REASON = {
    move_more: top.length?`You want to move more, so we prioritised ${listWords(top)} near you.`:'You want to move more, so we prioritised regular training venues near you.',
    unwind:'You want to unwind, so we prioritised calmer studios, pools and sauna.',
    try_new:'You want to try something new, so we mixed venue types instead of repeating one.'
  };
  if (answers.goal && GOAL_REASON[answers.goal]) reasons.push(GOAL_REASON[answers.goal]);
  /* the reason that answers the real question: how many of the places I'd actually
     use does this plan let me into? */
  let cov = groups.length && pool.length ? coverage(groups, pool, plan.id) : null;
  if (cov && !cov.totals.nearby) cov = null;   // "0 of the 0 places" is not a sentence
  if (cov) {
    reasons.push(`Of the ${plural(cov.totals.nearby,'place','places')} near ${areaName} ${cov.totals.nearby===1?'that does':'that do'} ${groupWords(groups)}, ${plan.name} lets you into ${cov.totals.included}.`);
    if (cov.totals.groupsMissing.length) notes.push(`${plan.name} does not include anywhere near you for ${cov.totals.groupsMissing.join(' or ')}.`);
  } else if (closeBy.length) reasons.push(`${closeBy.length} of your matches are within 2.5 km of ${areaName}.`);
  reasons.push(`${plan.name} opens ${plan.venueCount} venues, and gives you ${lowerFirst(plan.checkInModel)}.`);

  if (match.widened) notes.push('We had to look a little further out to find enough options near you.');
  if (!groups.length) notes.push('You haven’t told me which activities you’d actually do, so these matches are broad.');
  if (!answers.goal) notes.push('You haven’t told us what you want from it yet, so these matches are broad.');

  let explanation = `${plan.name} fits because ${lowerFirst(reasons[0]||'you want to get moving')}`;
  if ((match.venues||[]).length) {
    explanation += ` We found ${match.venues.length} venues around ${areaName}`;
    if (top.length) explanation += ` covering ${listWords(top)}`;
    explanation += '.';
  }
  explanation += ` ${plan.shortReason}.`;

  /* One short sentence for the headline decision. When we know what they'd do, the
     useful thing to say is how much of it this plan actually opens. */
  const headline = cov
    ? `It lets you into ${cov.totals.included} of the ${plural(cov.totals.nearby,'place','places')} near ${areaName} that do ${groupWords(groups)}.`
    : answers.frequency
      ? `Because you'd go ${FREQ_WORDS[answers.frequency]}${(match.venues||[]).length ? ` and there are ${match.venues.length} venues around ${areaName}` : ''}.`
      : `Based on what you've told me so far${(match.venues||[]).length ? `, and ${match.venues.length} venues around ${areaName}` : ''}.`;

  return { planId:plan.id, planName:plan.name, price:plan.priceMonthly, reasons, notes, appliedRules, headline,
           coverage: cov, groups, explanation: explanation.replace(/\s+/g,' ').trim() };
}
function provisionalPlan(answers, match) {
  if (!answers.goal && !answers.frequency) return null;
  const r = recommend(answers, match);
  return { planId:r.planId, planName:r.planName, price:r.price, shortReason: planById(r.planId).shortReason };
}

function interpret(qid, text) {
  const lower=(text||'').toLowerCase();

     and two postcodes are two answers. Capped at two, in the order they said them. */
  if (qid==='area') {

    const hits=[];
    for (const pc of lower.match(/\b\d{5}\b/g)||[]) if (POSTCODES[pc]) hits.push(POSTCODES[pc]);

     sauna" is two answers, and treating it as one throws half of it away. */
  if (qid==='activities') {

  for (const [id,words] of Object.entries(map)) { const hits=words.filter(w=>lower.includes(w)).length; if (hits>best.hits) best={id,hits}; }

const ACK = { goal:{ move_more:"Great — I'll find nearby activities that fit your routine.", unwind:"Good to know — I'll look for calmer places to reset.", try_new:"Nice — I'll look for a mix you haven't tried yet.", [SKIP]:"No problem — we can work it out as we go." },

/* ---------------- Ask Urby: grounded answers, no invention ----------------
   Urby answers only from data/faqs.json, data/plans.json and data/venues.json.
   Every answer carries the source it came from. When nothing matches well
   enough she says she doesn't know and offers a next step — which is what the
   brief asks for, and what a retrieval answer can guarantee and a generated
   one cannot.                                                              */
const STOP = new Set(['a','an','the','is','are','do','does','can','i','me','my','you','your','to','of','in','on','for','and','or','it','with','at','be','if','how','what','when','where','which','who','there','their','this','that','have','has','get','got','am','was','were','will','would','should','could','any','some','so','but','not','no','yes','about','from','as','by','they','we','us']);
const norm = s => (s||'').toLowerCase().replace(/[^\p{L}\p{N}\s€]/gu,' ').replace(/\s+/g,' ').trim();
const toks = s => norm(s).split(' ').filter(w => w.length>2 && !STOP.has(w));

/* activity words a visitor might use, mapped onto our venue activity ids */
const ACTIVITY_WORDS = { pool:'swimming', swim:'swimming', swimming:'swimming', lane:'swimming',
  yoga:'yoga', pilates:'pilates', barre:'barre', meditation:'meditation',
  gym:'gym', weights:'strength', strength:'strength', lifting:'strength', crossfit:'crossfit',
  boxing:'boxing', box:'boxing', martial:'martial_arts', climb:'climbing', climbing:'climbing',
  boulder:'bouldering', bouldering:'bouldering', dance:'dance', dancing:'dance',
  run:'running', running:'running', tennis:'tennis', padel:'padel',
  sauna:'sauna', spa:'spa', massage:'spa', wellness:'spa', hiit:'hiit', cardio:'cardio' };

/* words that name what the visitor wants to know, rather than narrowing it */
const INTENT = new Set(['pause','freeze','suspend','cancel','cancellation','upgrade','downgrade','change plan',
  'cost','price','cheapest','how much','plus','plus check-in','refund','get out','early']);
/* how many entries use each tag — rare tags identify a topic, common ones don't */
const ASK_DF = (() => { const d = {}; for (const f of KB) for (const t of f.tags) d[t] = (d[t]||0)+1; return d; })();

function askUrby(query) {
  const q = norm(query);
  if (!q || toks(q).length === 0) return null;
  const words = toks(q);

  /* (a) a question about what's near a place, answered from the venue data */
  const activity = Object.keys(ACTIVITY_WORDS).find(w => q.includes(w));
  const areaHit = AREAS.find(a => q.includes(norm(a.name)) || q.includes(norm(a.name).replace('ö','o')));
  if (activity && (areaHit || S.answers.area)) {
    const act = ACTIVITY_WORDS[activity];
    const mine = areaIds(S.answers.area);
    const from = areaHit || (mine.includes('anywhere') ? ANYWHERE : AREAS.find(a => a.id === mine[0])) || ANYWHERE;
    const hits = VENUES.map(v => ({ ...v, distanceKm: distanceKm(from, v) }))
      .filter(v => v.activities.includes(act)).sort((x,y) => x.distanceKm - y.distanceKm).slice(0,3);
    if (hits.length) return { kind:'venues', from, activity:act, venues:hits,
      answer:`Yes — ${hits.length === 1 ? 'one option' : hits.length + ' options'} for ${ACTIVITY_LABELS[act]||act} near ${from.name}.`,
      sourceLabel:'our venue data', sourceUrl:null };
    return { kind:'venues-none', answer:`I can't find ${ACTIVITY_LABELS[act]||act} in our sample data near ${from.name}. The real venue list is much larger than this pilot's, so it's worth checking the app.`,
      sourceLabel:'our venue data', sourceUrl:null };
  }

  /* (b) a question about the membership, answered from the FAQ knowledge base.

     Two things make the scoring behave:
     - Rare tags count for more than common ones. A tag that only one entry uses
       ("pause") identifies the topic; one that many share ("plan") does not.
     - Intent words outrank qualifiers. In "can I pause a 12-month membership?"
       the topic is pausing; "12-month" only narrows it. Without this the query
       matched the article about what happens at the end of a 12-month term. */
  const DF = ASK_DF;
  let best = { score:0, faq:null };
  for (const f of KB) {
    let score = 0;
    for (const tag of f.tags) {
      if (!q.includes(tag)) continue;
      if (INTENT.has(tag)) { score += 8; continue; }
      const rarity = 1 + 1.2 / (DF[tag] || 1);
      score += (tag.includes(' ') ? 3.0 : 2.0) * rarity;
    }
    const qw = toks(f.q), aw = toks(f.a);
    for (const w of words) { if (qw.includes(w)) score += 1.6; else if (aw.includes(w)) score += 0.45; }
    if (score > best.score) best = { score, faq:f };

  if (best.faq && best.score >= 3) {
    return { kind:'faq', answer:best.faq.a, question:best.faq.q, score:best.score,
             sourceLabel:'the Urban Sports Club help centre', sourceUrl:SOURCES[best.faq.source] || null };
  }

  /* (c) honest miss */
  return { kind:'unknown',
    answer:"I don't have a reliable answer to that. I only answer from our published plan and venue information, and I'd rather say so than guess.",
    sourceLabel:null, sourceUrl:null };
}

/* ---------------- search: the question everybody actually arrives with ----------
   "Is my local yoga studio on this?" Four reviewers went looking for the answer and
   the pilot did not have one: the only field that accepted a place name recorded it
   as demand for the partnerships team. Rule 62.

   Three shapes of query, one shape of answer. A name ("Yogarium"), a thing
   ("swimming in Kreuzberg"), or a place ("Sonnenallee 12"). Whatever comes back ends
   in the consequence that matters — which membership opens it — because a venue
   finder that stops at "yes, we have that" is a directory, and the argument of this
   whole journey is the join between the place and the price. Rule 63.

   The wording layer never decides any of this. The matching is the same deterministic
   pass over data/venues.json that the recommendation uses, so it works with no AI key
   and it cannot invent a venue (rules 1 and 2).                                    */
function searchPlaces(query) {
  const q = norm(query);
  if (!q) return null;
  const words = toks(q);
  /* An area we recognise in the query wins; failing that, one they have already told
     us about; failing that we are honestly city-wide and the screen says so. */
  const areaHit = AREAS.find(a => q.includes(norm(a.name)) || q.includes(norm(a.name).replace('ö','o')));
  const told = areaIds(S.answers.area).filter(id => id !== 'anywhere');
  const from = areaHit || AREAS.find(a => a.id === told[0]) || ANYWHERE;
  const known = Boolean(areaHit) || Boolean(told.length);
  const withKm = v => ({ ...v, distanceKm: distanceKm(from, v) });
  const base = { from, area: areaHit, known, query };

  /* (a) the whole query is a venue name, or contains one. The strongest signal there
     is, so it outranks everything — "LIQUIDROM" is not a request for spas in general. */
  const byWholeName = VENUES.filter(v => { const n = norm(v.name); return n.includes(q) || q.includes(n); })
    .map(withKm).sort((a,b) => a.distanceKm - b.distanceKm);
  if (byWholeName.length) return { ...base, kind:'venue', venues:byWholeName.slice(0,6) };

  /* (b) an activity, optionally anchored to an area we recognised. This has to come
     before the partial-name match below: half the venues in Berlin have a district in
     their name, so "swimming in Kreuzberg" was answering with a bouldering hall and a
     HYROX gym — both genuinely called Kreuzberg, neither of them a pool. */
  const actWord = Object.keys(ACTIVITY_WORDS).find(w => q.includes(w));
  if (actWord) {
    const act = ACTIVITY_WORDS[actWord];
    const hits = VENUES.filter(v => v.activities.includes(act)).map(withKm).sort((a,b) => a.distanceKm - b.distanceKm);
    return hits.length ? { ...base, kind:'activity', activity:act, venues:hits.slice(0,9) }
                       : { ...base, kind:'none', activity:act };
  }

  /* (c) part of a name, for anyone who typed half of one. Words that name a district
     are excluded for the reason above — they identify a neighbourhood, not a place. */
  const AREA_WORDS = new Set(AREAS.flatMap(a => toks(a.name)));
  const nameWords = words.filter(w => w.length > 3 && !AREA_WORDS.has(w));
  const byPartialName = nameWords.length ? VENUES.filter(v => {
    const parts = norm(v.name).split(' ');
    return nameWords.some(w => parts.some(part => part.startsWith(w)));
  }).map(withKm).sort((a,b) => a.distanceKm - b.distanceKm) : [];
  if (byPartialName.length) return { ...base, kind:'venue', venues:byPartialName.slice(0,6) };

  /* (d) a place and nothing else. A street address cannot be geocoded in a pilot with
     no map service, so we measure from the area we did recognise in it and say that
     out loud rather than presenting a number we cannot stand behind (rule 6). */
  if (areaHit) return { ...base, kind:'area', venues:VENUES.map(withKm).sort((a,b) => a.distanceKm - b.distanceKm).slice(0,9),
    approximated: /\d/.test(q) };
  return { ...base, kind:'none' };
}

/* The other half of the AI layer. Answering questions is the visible half; this
   is the half that pays for itself — what the visitor actually wanted, including
   the wants we could not serve, and what they were after at the moment they left.
   Every line is read back from something they did. Nothing here is guessed. */
function intentProfile() {
  const evs = n => S.events.filter(e => e.name === n);
  const L = id => answerLabel(id, S.answers[id]);
  const given = id => S.answers[id] && S.answers[id] !== SKIP;
  const wanted = [], said = [], gaps = [], signals = [];

  if (given('goal'))    wanted.push(`wants to ${lowerFirst(L('goal'))}`);
  if (given('activities')) wanted.push(`would actually do ${groupWords(S.answers.activities.filter(x=>x!==SKIP))}`);
  if (given('area'))    wanted.push(`looking around ${areaIds(S.answers.area).includes('anywhere') ? 'anywhere in Berlin' : 'Berlin-' + L('area')}`);
  if (given('frequency')) wanted.push(`expects to go ${lowerFirst(L('frequency'))}`);
  for (const id of ['goal','frequency']) if (S.answers[id] === SKIP) gaps.push(`Didn&rsquo;t know the answer to &ldquo;${esc(qById(id).prompt)}&rdquo;`);

  Object.entries(S.freeText || {}).forEach(([qid, text]) => { if (text) said.push(text); });

  const asks = evs('ula_asked');
  const missed = asks.filter(e => e.payload && ['none','unknown','venues-none'].includes(e.payload.matched));
  asks.filter(e => !missed.includes(e)).forEach(e => signals.push(`Asked Urby &ldquo;${esc(e.payload.question)}&rdquo;`));
  missed.forEach(e => gaps.push(`Asked &ldquo;${esc(e.payload.question)}&rdquo; &mdash; Urby had no approved answer`));
  evs('city_unavailable_requested').forEach(e => gaps.push(`Wanted <strong>${esc(e.payload.city)}</strong>, which this pilot cannot cover`));
  evs('venue_demand').forEach(e => gaps.push(`Asked us to add <strong>${esc(e.payload.place)}</strong> &mdash; a place they would use that we do not have`));

  const opened = evs('venue_opened').map(e => (VENUES.find(v => v.id === e.payload.venue) || {}).name).filter(Boolean);
  if (opened.length) signals.push(`Looked at ${opened.length} venue${opened.length === 1 ? '' : 's'}: ${esc([...new Set(opened)].join(', '))}`);
  if (S.planOverridden && S.chosenPlanId) signals.push(`Moved off Urby&rsquo;s recommendation to <strong>${esc(planById(S.chosenPlanId).name)}</strong>`);
  if (S.commitmentId !== 'monthly') signals.push(`Chose ${esc(commitmentById(S.commitmentId).label)} over paying monthly`);

  return { wanted, said, gaps, signals,
           sentence: wanted.length ? wanted.join(', ').replace(/^./, c => c.toUpperCase()) + '.' : null,
           stoppedAt: STEP_LABELS[S.lastStep] || S.lastStep };

      <button class="linkish venue-card__more" data-venue="${esc(v.id)}">Details</button>
    </div>

};

/* venue sheet — opens over the page so exploring never costs you your place */
/* "We think you're in Berlin — change it if we're wrong."
   An assumption a visitor can see and correct beats a silent one. */
function cityChip() {
  const picker = CITYPICK ? `<div class="citypick">
      <div class="citypick__label">Which city are you in?</div>
      <div class="citypick__grid">${CITIES.map(c=>`<button class="chip-sm ${c==='Berlin'?'is-current':''}" data-city="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      ${CITYWANTED?`<p class="citypick__note">${icon('info',17)} <span>This pilot only has venue data loaded for <b>Berlin</b>, so I&rsquo;ll keep searching there.
        I&rsquo;ve noted that you wanted <b>${esc(CITYWANTED)}</b> &mdash; that shows up in the <button class="linkish" data-go="data">journey data</button>.
        In production this list comes from the live venue database.</span></p>`
        :`<p class="citypick__note">${icon('info',17)} <span>Only Berlin has venues loaded in this pilot. Pick any city and I&rsquo;ll tell you honestly what I can show.</span></p>`}
    </div>` : '';
  return `<div class="geoblock">
    <div class="geochip">${icon('pin',16)}<span>Looks like you&rsquo;re in <b>Berlin</b></span>
      <button class="geochip__change" data-change-city aria-expanded="${CITYPICK}">${CITYPICK?'Close':'Change'}</button></div>
    ${picker}</div>`;
}

function venueSheet() {
  if (!SHEET) return '';
  const v = VENUES.find(x=>x.id===SHEET); if (!v) return '';
  const match = matchVenues(A());
  const found = (match.venues||[]).find(x=>x.id===v.id);
  const km = found ? found.distanceKm : Math.min(...((match.areas)||[match.anywhere?ANYWHERE:match.area]).map(a=>distanceKm(a,v)));
  const plan = currentPlan();
  const currentWeekDays = (S.weekDays && S.weekDays.length)
    ? S.weekDays : weekPlan(A().activities||[], match.pool||[], plan.id, A().frequency).sessions.map(x=>x.day);
  const activeDay = WEEK_ADD_DAY || currentWeekDays[0] || 'Monday';
  if (!WEEK_ADD_DAY) WEEK_ADD_DAY = activeDay;

  /* If opened via "Add to week", show a focused, lightweight Quick-Add bottom sheet */
  if (WEEK_ADD_MODE) {
    const areaLabel = v.nearestArea ? v.nearestArea.name : (AREAS.find(a=>a.id===v.area)||{}).name || '';
    const distLabel = areaLabel ? `${km} km from ${esc(areaLabel)}` : `${km} km away`;
    return `<div class="sheet sheet--quickadd" id="venue-sheet" role="dialog" aria-modal="true" aria-labelledby="quickadd-title">
      <div class="sheet__panel sheet__panel--quickadd">
        <div class="sheet__handle" aria-hidden="true"></div>
        <button class="sheet__close" data-close-sheet aria-label="Close">&times;</button>
        
        <div class="quickadd-card">
          <div class="quickadd-head">
            <div class="quickadd-thumb">${venueMedia(v)}</div>
            <div class="quickadd-info">
              <h2 id="quickadd-title" class="quickadd-title">${esc(v.name)}</h2>
              <p class="quickadd-sub">${esc(v.tierLabel||'Venue')} &middot; ${distLabel}</p>
            </div>
          </div>

          <div class="quickadd-body">
            <div class="quickadd-label">Choose a day for your routine</div>
            <div class="quickadd-days" role="group" aria-label="Select day">
              ${DAY_ORDER.map(day=>{
                const isSelected = WEEK_ADD_DAY === day;
                return `<button class="daybtn ${isSelected ? 'is-on' : ''}" type="button" data-add-day="${esc(day)}" aria-pressed="${isSelected}">${DAY_SHORT[day]}</button>`;
              }).join('')}
            </div>
          </div>

          <div class="quickadd-actions">
            <button class="btn btn--primary btn--block quickadd-btn" type="button" data-add-venue="${esc(v.id)}">
              Add to ${esc(WEEK_ADD_DAY || 'my week')}
            </button>
            <button class="linkish quickadd-details-btn" type="button" data-venue="${esc(v.id)}">
              View full studio details &amp; timetable &rarr;
            </button>
          </div>
        </div>
      </div>
    </div>`;
  }

  /* Full venue details profile */
  const included = plan.venueTiers.includes(v.tier);
  const firstPlan = PLANS.find(p=>p.venueTiers.includes(v.tier));
  const yours = v.access ? v.access[plan.id] : null;
  const firstAccess = v.access ? PLANS.find(pl=>v.access[pl.id] && !/^not included/i.test(v.access[pl.id])) : firstPlan;

  return `<div class="sheet" id="venue-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__panel">
      <button class="sheet__close" data-close-sheet aria-label="Close">&times;</button>
      <div class="sheet__media">${venueMedia(v)}</div>
      <div class="sheet__body">
        <h2 id="sheet-title" style="font-size:22px;font-weight:800;letter-spacing:-.01em">${esc(v.name)}</h2>
        <p class="small muted" style="margin:4px 0 0">${esc(v.tierLabel||'Venue')} · ${km} km from ${esc(match.anywhere?'the city centre':((found&&found.nearestArea)||match.area).name)}</p>
        ${v.address?`<p class="small muted" style="margin:4px 0 0">${icon('pin',15)} ${esc(v.address)}</p>`:''}
        
        <div class="sheet__weekadd">
          <p class="sheet__weekadd-title">Add to your week</p>
          <p class="sheet__weekadd-copy">Choose any day of the week to add this venue to your routine.</p>
          <div class="sheet__weekadd-days" role="group" aria-label="Choose a day">${DAY_ORDER.map(day=>{
            const isSelected = WEEK_ADD_DAY === day;
            return `<button class="daybtn ${isSelected ? 'is-on' : ''}" type="button" data-add-day="${esc(day)}" aria-pressed="${isSelected}">${DAY_SHORT[day]}</button>`;
          }).join('')}</div>
          <button class="btn btn--primary btn--block" type="button" data-add-venue="${esc(v.id)}">Add to ${esc(WEEK_ADD_DAY || 'my week')}</button>
        </div>

        <p style="font-size:15px;line-height:1.45;margin:14px 0 0">${esc(v.blurb)}</p>
        <div class="chips">${v.activities.map(a=>`<span class="chip-sm">${esc(ACTIVITY_LABELS[a]||a)}</span>`).join('')}</div>
        <div style="margin-top:16px">
          ${v.hoursWeekday?`<div class="sheet__row">${icon('clock',20)}<span><strong>Weekdays</strong><br>${esc(v.hoursWeekday)}</span></div>`:''}
          ${v.hoursWeekend?`<div class="sheet__row">${icon('calendar',20)}<span><strong>Weekends</strong><br>${esc(v.hoursWeekend)}</span></div>`:''}
          ${!v.hoursWeekday&&!v.hoursWeekend?`<div class="sheet__row">${icon('clock',20)}<span><strong>Opening hours</strong><br>Not published &mdash; this venue runs to a class timetable.</span></div>`:''}
          ${v.goodToKnow?`<div class="sheet__row">${icon('info',20)}<span><strong>Good to know</strong><br>${esc(v.goodToKnow)}</span></div>`:''}
        </div>
        ${v.access
          ? `<div class="covered ${yours && !/^not included/i.test(yours) ? 'covered--yes' : 'covered--no'}">${icon(yours && !/^not included/i.test(yours) ? 'checkThin' : 'info', 19)}
              <span>On <strong>${esc(plan.name)}</strong>: ${esc(yours || 'not published for this plan')}.${
                yours && /^not included/i.test(yours) && firstAccess ? ` Included from <strong>${esc(firstAccess.name)}</strong>, ${priceFor(firstAccess,S.commitmentId)} € a month.` : ''}</span></div>
             <div class="accesslist">${PLANS.map(pl=>`<div class="accesslist__row ${pl.id===plan.id?'is-yours':''}">
                <span>${esc(pl.name)}</span><span>${esc(v.access[pl.id]||'—')}</span></div>`).join('')}</div>`
          : `<div class="covered ${included?'covered--yes':'covered--no'}">${icon(included?'checkThin':'info',19)}
              <span>${included
                ? `Included in <strong>${esc(plan.name)}</strong> — ${lowerFirst(plan.checkInModel)}.`
                : `Needs a Plus check-in, which ${esc(plan.name)} doesn&rsquo;t include.`}</span></div>`}
        <p class="xsmall muted" style="margin-top:16px">Real venue data from ${v.url?`<a href="${esc(v.url)}" target="_blank" rel="noopener" style="text-decoration:underline">this venue&rsquo;s page on urbansportsclub.com</a>`:'urbansportsclub.com'}.</p>
        <div class="btn-row" style="margin-top:18px"><button class="btn btn--secondary btn--block" data-close-sheet>Close</button></div>
      </div></div></div>`;
}

function fitPanel(match, provisional, confirmed, withAsk) {
  const answered = QUESTIONS.filter(q=>S.answers[q.id]);
  const facts = QUESTIONS.map(q=>{
    const l=answerLabel(q.id,S.answers[q.id]); if(!l) return '';
    const text = q.id==='area' ? (areaIds(S.answers.area).includes('anywhere') ? 'Anywhere in Berlin' : 'Berlin · '+l) : l;
    return `<div class="fitpanel__fact">${icon(q.icon,21)}<span>${esc(text)}</span></div>`;
  }).filter(Boolean).join('');
  /* during the conversation the strip is the progressive reveal; once the recommendation
     is on screen the main column owns the venues, so don't show them twice */
  const venues = (S.answers.area && !confirmed) ? (match.venues||[]).slice(0,3) : [];
  const remaining = QUESTIONS.length - answered.length;
  const note = confirmed
    ? `<div class="panel-note">${icon('checkThin',19)}<span>This is your recommendation. You can change it any time.</span></div>`
    : provisional ? `<div class="panel-note">${icon('sparkle',19)}<span>${remaining>1?`I'll confirm this after ${remaining} more questions.`:remaining===1?`I'll confirm this after one more question.`:'Ready when you are.'}</span></div>` : '';
  const planBlock = provisional?`<div class="plan-card"><span class="plan-card__icon">${icon('star',22)}</span><div>
      <div class="plan-card__name">${esc(provisional.planName)}</div>
      <div class="plan-card__price"><b>${provisional.price} €</b> <span>/ month</span></div>
      <div class="plan-card__reason">${esc(provisional.shortReason)}</div></div></div>`:'';
  const contents = fitContents(match, confirmed, provisional, facts, venues, note, planBlock);
  /* On a question screen the right column carries the AI itself: ask anything,
     any time, without leaving the question you are on. */
  return `<aside class="two-col__aside">
    ${withAsk?`<div class="aside-ask">${askBlock(true)}</div>`:''}
    <button class="fitpanel-mobile-toggle" data-toggle-fitpanel aria-expanded="${PANEL_OPEN}" aria-controls="fitpanel-contents">
      <span>Your fit so far · ${answered.length} answer${answered.length===1?'':'s'}</span>${icon('chevron',20)}</button>
    <div class="fitpanel"><div class="fitpanel__contents ${PANEL_OPEN?'is-open':''}" id="fitpanel-contents">${contents}</div></div></aside>`;
}

function fitContents(match, confirmed, provisional, facts, venues, note, planBlock) {
  return `<h2>Your fit, so far</h2>
    <div class="fitpanel__facts">${facts||'<p class="small muted">Nothing yet — Urby is about to ask.</p>'}</div>
    ${venues.length?`<hr><div class="fitpanel__label">Nearby venues we found for you</div><div class="venue-strip">${venues.map(v=>venueCard(v)).join('')}</div>
      ${match.widened?`<p class="xsmall muted" style="margin-top:10px">Looked a little further out to find enough options.</p>`:''}`:''}
    ${provisional?`<hr><div class="fitpanel__label">${confirmed?'Your membership':'Looking like a fit'}</div>${planBlock}`:''}
    ${note}`;
}

/* Just the panel's contents, for the recommendation screen where the aside is
   already a column of its own. */
function fitPanelContents(match, confirmed) {
  const answered = QUESTIONS.filter(q=>isAnswered(S.answers[q.id]));
  const facts = QUESTIONS.map(q=>{
    const l=answerLabel(q.id,S.answers[q.id]); if(!l) return '';
    const text = q.id==='area' ? (areaIds(S.answers.area).includes('anywhere') ? 'Anywhere in Berlin' : 'Berlin · '+l) : l;
    return `<div class="fitpanel__fact">${icon(q.icon,21)}<span>${esc(text)}</span></div>`;
  }).filter(Boolean).join('');
  return `<div class="fitpanel"><div class="fitpanel__contents is-open">
    <h2>Your answers</h2>
    <div class="fitpanel__facts">${facts||'<p class="small muted">Nothing yet.</p>'}</div>
    <p class="xsmall muted" style="margin-top:18px">Change any of these from &ldquo;Change an answer&rdquo; and everything on this page recalculates.</p>
  </div></div>`;
}

/* Included with the membership and never mentioned on the pricing page: the app
   catalogue. It sits next to the venues because it is the same question — what do
   I actually get — and it is honest about the one condition attached to it. */
function appsBlock() {
  if (!APPS.length) return '';
  const mine = appsFor(S.commitmentId);
  const slots = APP_UNLOCK[S.commitmentId] || 0;
  /* Four logos on one row, inside the places card, because it answers the same
     question — what do I actually get — and because the end of this page was
     already the part testers said they could not process. */
  const all = mine.length ? mine : appsFor('annual');
  const locked = !slots;
  const groups = (A().activities||[]).filter(x=>x!==SKIP);
  const ranked = rankApps(all, groups, A().goal);
  const card = a => `<div class="appcard">${appLogo(a)}<span class="appcard__text">
    <span class="appcard__name">${esc(a.name)}</span><span class="appcard__cat">${esc(a.category)}</span></span></div>`;
  /* Karim's design, 14 Aug: one row, the same row the places wear. The claim and the one
     condition attached to it are on the handle; four logos chosen from the answers prove
     the catalogue is real; the other seven are behind "See all apps". A bare disclosure
     hid the whole thing, and eleven logos at once made this the largest block on the page
     carrying its smallest argument — nobody joins for the apps.
     The two term buttons live in the body, not on the handle: a button inside a summary
     is a click that means two things. */
  const chip = a => `<span class="appchip">${appLogo(a)}<span>${esc(a.name)}</span></span>`;
  return `<details class="rowcard rowcard--apps"${APPSOPEN?' open':''}>
    <summary class="rowcard__head" data-toggle-apps>
      <span class="rowcard__icon">${icon('device',22)}</span>
      <span class="rowcard__text"><b>Plus ${all.length} fitness apps</b>
        <small>${locked
          ? 'with a 12- or 24-month membership'
          : `${slots===1?'one':'two'} at a time, switchable, included in your term`}</small></span>
      <!-- Two, not four: the story column is 860px and a third name had to be cut short to
           fit, which proves nothing. The other nine are behind "See all apps". -->
      <span class="rowcard__chips">${ranked.list.slice(0,2).map(chip).join('')}</span>
      <span class="rowcard__cta">See all apps ${icon('arrowRight',18)}</span>
    </summary>
    <div class="rowcard__body">
      <div class="appgrid ${locked?'is-locked':''}">${ranked.list.map(card).join('')}</div>
      <div class="apps__foot">
        <!-- "Closest to", not "for": the app's category is published, the join from an
             activity to a category is ours. Rule 6 — approximation says so. -->
        <span class="apps__note">${ranked.matched && groups.length
          ? `Closest to ${esc(groupWords(groups))} first`
          : `From the published catalogue`}</span>
      </div>
      ${locked?`<p class="apps__unlock">${icon('info',15)}<span>Free on a
        <button class="linkish strong" type="button" data-commit="annual">12-month</button> or
        <button class="linkish strong" type="button" data-commit="biennial">24-month</button> membership.</span></p>`:''}
    </div>
  </details>`;
}

/* Guy's point, and Karim's: a radius is the wrong tool when someone has told us
   two neighbourhoods. We search both, we say plainly when we had to look further,
   and when the answer is genuinely thin we ask for the place they wish were there.
   That is the one piece of information nobody else in the funnel can collect, and
   it lands in the journey data as demand rather than disappearing. */
function partnerAsk(match, groups) {
  const where = whereName(match);
  const thin = match.reachedFurther || match.widened || (match.pool||[]).length < 3;
  if (PLACEWANTED) return `<div class="notice" style="margin-top:16px">${icon('checkThin',19)}<span>Noted &mdash;
    <b>${esc(PLACEWANTED)}</b> near ${esc(where)}. It shows up in the <button class="linkish" data-go="data">journey data</button> as a place members are asking for.</span></div>`;
  return `<details class="partnerask"${thin?' open':''}>
    <summary>${icon('pin',16)} <span>${thin?`Not enough nearby?`:`Somewhere you go that isn&rsquo;t here?`} Tell us what to add</span></summary>
    <form data-form="place-demand" class="partnerask__form">
      <input type="text" name="place" placeholder="Name a studio, gym or pool near ${esc(where)}" aria-label="A place we should add">
      <button class="btn btn--secondary" type="submit" style="height:48px;font-size:16px">Suggest it</button>
    </form>
    <p class="xsmall muted">We pass this to the partnerships team. Nothing here is booked or shared with the place itself.</p>
  </details>`;
}

/* ---------------- screens ---------------- */
function landing() {
  /* Karim's layout, August 13. The order is the argument: what this is, what you
     get, then the one field that starts it — and the reason we ask for it, stated
     in five words rather than defended in three sentences.

     The one thing his mock did not carry is a way past the email. The PM session's
     hardest trust finding was Cristiano's "wizards are perceived as tools to trick
     users into giving an email", so it stays — but as four words on the same line
     as the save note, not as a second button competing with the first. */
  /* The email came off this page on 13 August. Rule 25 had already made it optional,
     and three reviews had already said it felt like a toll gate — but "optional" is a
     property of the form and not of the feeling, and a fourth reviewer still read a
     field on the front door as the price of admission. The address only ever existed
     to power the resume link, so it is now asked on the save screen, where the visitor
     can see what it buys. Rule 61.

     What replaces it is the question those same reviewers actually arrived with:
     "is my studio on this?" Nothing in the pilot could answer it — the one box that
     took a place name filed it as demand and moved on. A search field is also the most
     familiar control on the internet, which is the answer to "I did not know where to
     begin". So the page now opens by offering something instead of asking for something,
     and the guide sits underneath it as the way in for anyone who has no name to type. */
  /* The control arm, kept deliberately. `?variant=email-first` still renders the page as
     it was — the optional address, the conditional consent row, the terms line — because
     "we took the email off the front door" is exactly the kind of claim a pilot should be
     able to show side by side rather than assert. It is the old page, unchanged, not a
     softened one. */
  const emailFirst = `<form data-form="start" novalidate>
        <div class="ula-intro">

  /* Clean, high-converting hero card + secondary actions */
  const guideFirst = `
    <div class="landing-hero-card">
      <div class="landing-hero-card__badge">${icon('sparkle',12)} <span>RECOMMENDED</span></div>
      <h2 class="landing-hero-card__title">Help me choose</h2>
      <div class="landing-hero-card__meta">
        <span class="meta-item">${icon('question',15)} <span>4 questions</span></span>
        <span class="meta-dot">&middot;</span>
        <span class="meta-item">${icon('clock',15)} <span>2 minutes</span></span>
        <span class="meta-dot">&middot;</span>
        <span class="meta-item">${icon('lock',14)} <span>No email needed</span></span>
      </div>
      <button class="btn btn--primary btn--block landing-hero-card__btn" type="button" data-start-fit>

    <div class="landing-sub-actions">

        <div class="sub-action-btn__left">
          ${icon('search',17)}
          <span>Find a venue</span>
        </div>
        <span class="sub-action-btn__arrow">&rarr;</span>
      </button>

      <button class="sub-action-btn" type="button" data-go="plans">
        <div class="sub-action-btn__left">
          ${icon('grid',17)}
          <span>Compare memberships</span>
        </div>
        <span class="sub-action-btn__arrow">&rarr;</span>
      </button>
    </div>`;
  const primary = VARIANT === 'email-first' ? emailFirst : guideFirst;
  return `<main class="landing" id="main">
    <div class="landing__panel">
      <div class="landing__panelbar"><button class="wordmark linkish" style="text-decoration:none" data-go="landing">Urban Sports Club</button>
        <button class="login-link login-link--mobile linkish" data-go="login">Log in</button></div>
      <div class="landing__body">
        <h1 class="h-hero" tabindex="-1">Find your way<br>to move.</h1>
        <p class="lede">Choose how you&rsquo;d like to start today.</p>
        ${S.returns?`<div class="notice" style="max-width:560px">${icon('checkThin',20)}<span>Welcome back. Your answers are saved — continue where you left off.</span></div>`:''}
        ${primary}

          <span class="option-card__chev">${icon('chevron',17)}</span></button>`).join('')}

         field. Nothing on this page collects anything any more, so the sentence went and
         the links moved here, where they belong on a page that makes no request. -->
    Urban Sports Club pilot · real plans, terms and venues · <button class="linkish" data-go="terms">Terms</button> · <button class="linkish" data-go="privacy">Privacy</button> · <button class="linkish" data-go="data">journey data</button> · <button class="linkish" data-go="email">follow-up email preview</button>
  </footer>`;
}

/* Where this page is looking from. If they have told us, it is theirs; if they have not,
   it is the detected guess — and the guess is labelled as one, never presented as their
   answer (rules 26 and 53). */
function browseOrigin() {
  const ids = areaIds(S.answers.area);
  const picked = ids.filter(id => id !== 'anywhere').map(id => AREAS.find(a=>a.id===id)).filter(Boolean);
  if (picked.length) return { origins:picked, mine:true, anywhere:false, label:`near ${listWords(picked.map(a=>a.name))}` };
  if (ids.includes('anywhere')) return { origins:[ANYWHERE], mine:true, anywhere:true, label:'across Berlin' };
  const guess = AREAS.find(a=>a.id===DETECTED_AREA) || AREAS[0];
  return { origins:[guess], mine:false, anywhere:false, label:`near ${guess.name}` };
}

/* What the venue page browses: every place in the pilot that does what they asked for,
   inside the distance they asked for, nearest first. Deliberately not matchVenues() —
   that one widens the radius by itself so a recommendation is always possible, and a
   list with a distance control on it must show exactly what the control says it shows. */
function browsePlaces() {
  const o = browseOrigin();
  const radius = RADII.find(x=>x.id===(S.radiusKm||'auto')) || RADII[0];
  const groups = (A().activities||[]).map(groupById).filter(Boolean);
  let list = VENUES.map(v => ({ ...v,
    distanceKm: Math.round(Math.min(...o.origins.map(a=>distanceKm(a,v))) * 10) / 10 }));
  if (groups.length) list = list.filter(v => groups.some(g=>venueInGroup(v,g)));
  list.sort((a,b) => a.distanceKm - b.distanceKm);
  return { ...o, radius, groups, list,
    within: radius.km ? list.filter(v => v.distanceKm <= radius.km) : list };
}

/* One card, two questions. Browsing, the badge answers "what would open this place?" at
   a glance and the card ends in the way into the detail. Searching, they asked about one
   named place, so the foot spells the join out in full with the price (rule 63) and the
   badge comes off rather than say the plan's name twice on one card (rule 33). */
function placeCard(v, opts = {}) {
  const { known = true, from = null, focus = null, priced = false } = opts;
  const lowest = firstPlanWithAccess(v);
  const tierClass = lowest ? (lowest.id === 'plus' ? 'hit__badge--plus' : lowest.id === 'premium' ? 'hit__badge--premium' : 'hit__badge--standard') : '';
  const acts = v.activities.slice(0,3).map(a => ACTIVITY_LABELS[a]||a).join(', ');
  /* Browsing, the place we measured from is named once under the row rather than on all
     four cards (rule 33); a single searched result has no such line, so it carries it. */
  const where = known ? `${v.distanceKm} km${from?` from ${esc(from)}`:''}` : 'in Berlin';
  const content = `<span class="hit__media">${venueMedia(v, focus ? [focus] : null)}${priced || !lowest ? ''
      : `<span class="hit__badge ${tierClass}">${esc(lowest.name)}</span>`}</span>
    <span class="hit__body">
      <span class="hit__name">${esc(v.name)}</span>
      <span class="hit__meta">${esc(acts)} &middot; ${where}</span>
      ${priced
        ? `<span class="hit__plan">${lowest
            ? `${icon('checkThin',16)}<span>Included from <b>${esc(lowest.name)}</b><small>${priceFor(lowest,S.commitmentId)} &euro; a month</small></span>`
            : `${icon('info',16)}<span>Not on any membership in this pilot&rsquo;s data</span>`}</span>`
        : WEEK_ADD_MODE ? '' : `<span class="hit__view">View details ${icon('arrowRight',17)}</span>`}
    </span>`;
  if (WEEK_ADD_MODE) return `<article class="hit hit--week">
    <button class="hit__details" data-venue="${esc(v.id)}" aria-label="More about ${esc(v.name)}">${content}</button>
    <span class="hit__actions"><button class="hit__add" type="button" data-add-venue="${esc(v.id)}" ${WEEK_ADD_DAY?'':'disabled'}
      aria-label="${WEEK_ADD_DAY?`Add ${esc(v.name)} to ${esc(WEEK_ADD_DAY)}`:'Choose a day before adding this venue'}">
      ${WEEK_ADD_DAY?'Add':'Choose a day above'}</button>
      <button class="linkish hit__more" type="button" data-venue="${esc(v.id)}">View details</button></span>
  </article>`;
  return `<button class="hit" data-venue="${esc(v.id)}" aria-label="More about ${esc(v.name)}">
    ${content}
  </button>`;
}

function weekPickBar() {
  if (!WEEK_ADD_MODE) return '';
  const match=matchVenues(A()), plan=currentPlan();
  const days=(S.weekDays&&S.weekDays.length) ? S.weekDays
    : weekPlan(A().activities||[],match.pool||[],plan.id,A().frequency).sessions.map(x=>x.day);
  return `<div class="weekpick">
    <div class="weekpick__copy"><b>Adding to ${WEEK_ADD_DAY?esc(WEEK_ADD_DAY):'your week'}</b>
      <span>Pick a day once, then add any venue directly.</span></div>
